<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnowyScripts Web</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

  * {
    font-family: 'Poppins', sans-serif;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #0a1a2f 0%, #11263f 40%, #1c3b5a 100%);
  }

  .glow-text {
    text-shadow: 0 0 20px rgba(173, 216, 255, 0.8), 0 0 40px rgba(100, 180, 255, 0.5);
  }

  .snowflake {
    position: fixed;
    top: -10px;
    color: #fff;
    user-select: none;
    pointer-events: none;
    opacity: 0.8;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
    }
    100% {
      transform: translateY(110vh) translateX(20px) rotate(360deg);
    }
  }

  .fade-in {
    animation: fadeIn 1.8s ease-out forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .pulse-dot {
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.2); }
  }
</style>
</head>
<body class="h-screen w-screen relative flex items-center justify-center">

  <!-- Snowflakes container -->
  <div id="snow-container"></div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center justify-center text-center px-6 fade-in">
    <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold text-white glow-text tracking-wide mb-6">
      Snowy<span class="text-sky-300">Scripts</span> Web
    </h1>
    <p class="text-lg sm:text-2xl text-sky-100 font-light tracking-[0.3em] uppercase mb-10">
      Coming Soon
    </p>
    <div class="flex space-x-3">
      <span class="w-3 h-3 bg-sky-300 rounded-full pulse-dot" style="animation-delay: 0s;"></span>
      <span class="w-3 h-3 bg-sky-300 rounded-full pulse-dot" style="animation-delay: 0.2s;"></span>
      <span class="w-3 h-3 bg-sky-300 rounded-full pulse-dot" style="animation-delay: 0.4s;"></span>
    </div>
  </div>

  <script>
    const snowContainer = document.getElementById('snow-container');
    const flakeCount = 60;

    for (let i = 0; i < flakeCount; i++) {
      const flake = document.createElement('div');
      flake.classList.add('snowflake');
      flake.innerHTML = '❄';
      const size = Math.random() * 1.2 + 0.5;
      flake.style.fontSize = size + 'rem';
      flake.style.left = Math.random() * 100 + 'vw';
      flake.style.animationDuration = (Math.random() * 8 + 6) + 's';
      flake.style.animationDelay = (Math.random() * 10) + 's';
      flake.style.opacity = Math.random() * 0.6 + 0.4;
      snowContainer.appendChild(flake);
    }
  </script>
</body>
</html>
